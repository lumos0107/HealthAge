      ['PDF로 내보내기', '병원에 가져가거나 가족과 나눌 수 있게 검진 결과를 PDF로 저장합니다.']] },
    detail: { name: '항목 상세', lead: '한 항목을 깊이 봅니다', points: [
      ['결론', '이 항목이 지금 어떤지 한 줄로 알려 줍니다.'],
      ['값과 그래프', '해마다 값이 어떻게 바뀌었는지 봅니다.'],
      ['이 지표는요 · 또래와 견주면', '무엇을 재는 값인지, 같은 또래 속 어디쯤인지 봅니다.'],
      ['이렇게 해 보세요', '생활 속에서 해 볼 일을 알려 줍니다.']] }
  };
  var body = document.getElementById('g-body');
  var cur = null, timer = null;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function paint(key) {
    var g = G[key];
    document.getElementById('g-title').textContent = g.name;
    document.getElementById('g-lead').textContent = g.lead;
    var h = '';
    for (var i = 0; i < g.points.length; i++) {
      h += '<li><i>' + (i + 1) + '</i><div><b>' + esc(g.points[i][0]) + '</b><span>' + esc(g.points[i][1]) + '</span></div></li>';
    }
    document.getElementById('g-points').innerHTML = h;
    var m = '';
    for (var j = 0; j < ORDER.length; j++) {
      m += '<span' + (ORDER[j] === key ? ' class="on"' : '') + '>' + G[ORDER[j]].name + '</span>';
    }
    document.getElementById('g-map').innerHTML = m;
    document.body.setAttribute('data-screen', key);
  }
  function show(key) {
    if (!G[key] || key === cur) return;
    var first = cur === null;
    cur = key;
    if (first) { paint(key); return; }
    clearTimeout(timer);
    body.className = 'out';
    timer = setTimeout(function () { paint(key); body.className = ''; }, 250);
  }
  window.addEventListener('message', function (e) {
    if (e.origin !== APP_ORIGIN) return;
    var d = e.data;
    if (!d || d.source !== 'healthage') return;
    show(d.detail ? 'detail' : d.tab);
  });
  show('dashboard');
})();
</script>

</div>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    var x = (window.innerWidth - 1920 * s) / 2, y = (window.innerHeight - 1080 * s) / 2;
    stage.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
