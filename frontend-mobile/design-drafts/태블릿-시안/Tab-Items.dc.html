<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>태블릿 검사항목</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
body{margin:0;word-break:keep-all;font-family:'Pretendard','Noto Sans KR',sans-serif;color:#191F28}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav{width:84px;margin:0 auto;text-align:center;font-size:14px;color:#4E5968;padding:6px 0;min-height:64px;box-sizing:border-box}
.nav i{display:flex;width:56px;height:34px;margin:0 auto 4px;border-radius:999px;align-items:center;justify-content:center;font-style:normal}
.nav.on{color:#00814D;font-weight:700}.nav.on i{background:#E6F9F1}
.card{background:#fff;border-radius:20px}
.bd{font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;line-height:1.3}
.w{background:#FFF3E7;color:#A95D05}.d{background:#FEE9EB;color:#D71121}.o{background:#EAF7F1;color:#1D7F56}.g{background:#F2F4F6;color:#4E5968}
.btn{min-height:48px;border-radius:14px;border:0;background:#00C073;color:#fff;font-size:18px;font-weight:700;font-family:inherit;padding:0 20px}
.btn2{min-height:48px;border-radius:14px;border:0;background:#F2F4F6;color:#191F28;font-size:18px;font-weight:700;font-family:inherit;padding:0 20px}
.chip{min-height:48px;padding:0 18px;border-radius:999px;background:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center;box-sizing:border-box;white-space:nowrap}
.chip.on{background:#191F28;color:#fff;font-weight:700}
.seg{display:flex;gap:4px;background:#fff;border-radius:16px;padding:4px}
.seg div{flex:1;min-height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:700;color:#4E5968}
.seg div.on{background:#00C073;color:#fff}
.h3{font-size:20px;font-weight:800;line-height:1.35}
.cap{font-size:14px;color:#4E5968;line-height:1.5}
.tl{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;min-height:76px;box-sizing:border-box;width:100%;border:0;border-radius:16px;background:#fff;text-align:left;font-family:inherit;color:#191F28;cursor:pointer}
.tl .ch{flex:none;width:20px;text-align:center}
.sq{width:44px;height:44px;border-radius:14px;background:#E8F1FF;color:#2B6DE0;display:flex;align-items:center;justify-content:center;flex:none;font-style:normal}
.sq .ic{width:24px;height:24px}
.tx{flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.35}
.tx small{display:block;font-size:14px;font-weight:400;color:#4E5968}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.rt b{font-size:18px;font-weight:800;white-space:nowrap}
.rt b small{font-size:14px;font-weight:500;color:#4E5968;margin-left:2px}
.tr{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #F2F4F6;min-height:64px;box-sizing:border-box}
.tr .t{flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.35}.tr .t small{display:block;font-size:14px;font-weight:400;color:#4E5968}
.rk{width:24px;font-size:16px;font-weight:800;color:#4E5968}
.ch{color:#66717E;font-size:20px}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
<symbol id="i-body" viewBox="0 0 24 24"><path d="M12 3.5a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zM5 9.5h14M12 9.5V15M8.5 21 12 15l3.5 6"/></symbol>
<symbol id="i-liver" viewBox="0 0 24 24"><path d="M3 10c0-3 3-5 7-5h6c3 0 5 2 5 5 0 5-4 9-9 9-5 0-9-3-9-9z"/></symbol>
<symbol id="i-pill" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="7" rx="3.5" transform="rotate(-40 12 12)"/></symbol>
</defs></svg>
<div style="width:768px;height:1340px;position:relative;overflow:hidden;background:#F3F5F7;display:flex">
  <div style="width:96px;flex:none;background:#fff;display:flex;flex-direction:column;padding:20px 0;box-sizing:border-box;gap:6px">
    <div style="width:44px;height:44px;border-radius:13px;background:#00C073;color:#fff;margin:0 auto 18px;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg></div>
    <div class="nav"><i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></i>홈</div>
    <div class="nav on"><i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></i>검사항목</div>
    <div class="nav"><i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/></svg></i>히스토리</div>
    <div class="nav"><i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg></i>분석</div>
    <div class="nav"><i><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></i>업로드</div>
  </div>
  <div style="flex:1;min-width:0;padding:28px 28px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div><div style="font-size:24px;font-weight:800;line-height:1.35">검사항목</div><div style="font-size:16px;color:#4E5968;margin-top:2px">연도를 고르고 항목을 누르면 자세한 설명을 볼 수 있어요.</div></div>
      <button aria-label="내 정보" style="width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:#4E5968;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
    </div>
    <div class="seg">
      <div class="on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>검사 항목</div>
      <div class=""><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><use href="#i-pill"/></svg>복용약 정보</div>
    </div>
    <div style="display:flex;gap:8px"><span class="chip on">2024년</span><span class="chip">2022년</span><span class="chip">2020년</span><span class="chip">2018년</span><span class="chip">2016년</span><span class="chip">2014년</span></div>
    <div style="display:flex;gap:8px"><span class="chip o" style="font-weight:700">■ 정상 6</span><span class="chip w" style="font-weight:700">● 주의 8</span><span class="chip d" style="font-weight:700">▲ 위험 1</span></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px"><div class="h3">2024년 · 서울대병원 강남센터</div><div style="font-size:14px;font-weight:700;color:#00814D">항목을 눌러 자세히 보기</div></div>
      <div class="cap" style="padding:0 4px;margin-top:-6px">먼저 확인하면 좋은 순서로 정렬했어요.</div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(9,auto);grid-auto-flow:column;gap:10px"><button class="tl" aria-label="체질량지수(BMI) 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-body"/></svg></i><span class="tx">체질량지수(BMI)<small>키·몸무게 비만도</small></span><span class="rt"><b>25.2<small>kg/m²</small></b><span class="bd d">▲ 위험</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="수축기 혈압 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-heart"/></svg></i><span class="tx">수축기 혈압</span><span class="rt"><b>134<small>mmHg</small></b><span class="bd w">● 주의</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="이완기 혈압 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-heart"/></svg></i><span class="tx">이완기 혈압</span><span class="rt"><b>85<small>mmHg</small></b><span class="bd w">● 주의</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="공복혈당 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop"/></svg></i><span class="tx">공복혈당</span><span class="rt"><b>110<small>mg/dL</small></b><span class="bd w">● 주의</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="총콜레스테롤 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop"/></svg></i><span class="tx">총콜레스테롤</span><span class="rt"><b>216<small>mg/dL</small></b><span class="bd w">● 주의</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="LDL-C 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop"/></svg></i><span class="tx">LDL-C<small>나쁜 콜레스테롤</small></span><span class="rt"><b>145<small>mg/dL</small></b><span class="bd w">● 주의</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="HDL-C 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop"/></svg></i><span class="tx">HDL-C<small>좋은 콜레스테롤</small></span><span class="rt"><b>39<small>mg/dL</small></b><span class="bd w">● 주의</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="중성지방 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop"/></svg></i><span class="tx">중성지방<small>혈액 속 지방</small></span><span class="rt"><b>168<small>mg/dL</small></b><span class="bd w">● 주의</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="감마-GTP 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-liver"/></svg></i><span class="tx">감마-GTP<small>간·음주 효소</small></span><span class="rt"><b>64<small>IU/L</small></b><span class="bd w">● 주의</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="키 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-body"/></svg></i><span class="tx">키</span><span class="rt"><b>165.9<small>cm</small></b><span class="bd g">○ 참고</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="몸무게 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-body"/></svg></i><span class="tx">몸무게</span><span class="rt"><b>69.4<small>kg</small></b><span class="bd g">○ 참고</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="허리둘레 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-body"/></svg></i><span class="tx">허리둘레</span><span class="rt"><b>88<small>cm</small></b><span class="bd o">■ 정상</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="AST 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-liver"/></svg></i><span class="tx">AST<small>간 효소</small></span><span class="rt"><b>27<small>IU/L</small></b><span class="bd o">■ 정상</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="ALT 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-liver"/></svg></i><span class="tx">ALT<small>간 효소</small></span><span class="rt"><b>33<small>IU/L</small></b><span class="bd o">■ 정상</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="혈색소 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop"/></svg></i><span class="tx">혈색소<small>산소 운반 능력</small></span><span class="rt"><b>15.1<small>g/dL</small></b><span class="bd o">■ 정상</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="혈청 크레아티닌 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop"/></svg></i><span class="tx">혈청 크레아티닌<small>신장 노폐물</small></span><span class="rt"><b>0.99<small>mg/dL</small></b><span class="bd o">■ 정상</span></span><span class="ch" aria-hidden="true">›</span></button><button class="tl" aria-label="요단백 자세히 보기"><i class="sq"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop"/></svg></i><span class="tx">요단백<small>소변 속 단백질</small></span><span class="rt"><b>음성</b><span class="bd o">■ 정상</span></span><span class="ch" aria-hidden="true">›</span></button></div>
    </div>
    <div class="cap" style="text-align:center;color:#66717E;margin-top:4px">참고용이에요. 걱정되면 의료진과 상담해 보세요.</div>
  </div>
</div>
</x-dc>
