<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>헬스에이지 체험판</title>
    <meta name="build" content="d4c0b65-11240301" />
    <meta name="description" content="건강검진 결과지 사진 한 장으로 시작하는 건강 분석 · 데모 계정 체험판" />
    <meta name="theme-color" content="#E6F9F1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="헬스에이지" />
    <link rel="manifest" href="/HealthAge/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/HealthAge/favicon-32.png" />
    <link rel="apple-touch-icon" href="/HealthAge/apple-touch-icon.png" />
    <style>
      /* 가변 글꼴은 굵기 범위를 적어야 사파리(아이폰)·파이어폭스가 굵은 글자를 제대로 그림.
         expo-font가 넣는 선언엔 범위가 없어서 같은 파일로 범위 있는 선언을 하나 더 둔다. */
      @font-face { font-family: Pretendard; src: url(/HealthAge/assets/assets/fonts/PretendardVariable.872a6c5775ec910058a9a409a201972a.woff2) format('woff2'); font-weight: 100 900; font-display: swap; }
      /* 그래프(SVG) 글자에 글꼴이 안 정해져 있으면 브라우저 기본(명조)으로 나와서 body 글꼴을 물려줌 */
      html, body { font-family: Pretendard, system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #FFFFFF; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               gap: 18px; background: #FFFFFF; z-index: 9999; transition: opacity .3s; }
      #boot img { width: 88px; height: 88px; border-radius: 22px; }
      #boot p { margin: 0; font-size: 16px; color: #5B6B7F; }
      #boot.off { opacity: 0; pointer-events: none; }
      /* 폰(앱이 폰 화면으로 그려지는 폭 700 이하)에서만 맨 위 띠: 체험판 표시 + 안드로이드 앱 받기.
         앱을 띠 아래로 내려 하단 탭과 겹치지 않게 한다. 넓은 화면은 앱이 100vh를 써서 띠를 안 붙인다. */
      #strip { display: none; }
      @media (max-width: 700px) {
        #strip { display: flex; position: fixed; top: 0; left: 0; right: 0; height: 36px; padding: 0 14px;
                 align-items: center; justify-content: space-between; background: #E6F9F1; font-size: 13px; z-index: 10; }
        #strip span { color: #4B5563; }
        #strip a { color: #00814D; font-weight: 700; text-decoration: none; padding: 9px 0 9px 12px; }
        #root { position: fixed; top: 36px; left: 0; right: 0; bottom: 0; height: auto !important; }
      }
    </style>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
        <div id="strip"><span>웹 체험판 · 예시 자료</span><a href="/HealthAge/app.html">안드로이드 앱 받기 ›</a></div>
    <div id="root"></div>
    <div id="boot" aria-live="polite"><img src="/HealthAge/icon-192.png" alt="" /><p>헬스에이지 체험판을 여는 중…</p></div>
    <script>
      // 앱이 글자를 그리기 시작하면 불러오는 중 화면을 걷음(늦어도 20초 뒤엔 걷음)
      (function () {
        var t0 = Date.now(), boot = document.getElementById('boot'), root = document.getElementById('root');
        var iv = setInterval(function () {
          if ((root.innerText || '').trim().length > 0 || Date.now() - t0 > 20000) {
            clearInterval(iv); boot.classList.add('off'); setTimeout(function () { boot.remove(); }, 400);
          }
        }, 150);
      })();
    </script>

  <script src="/HealthAge/_expo/static/js/web/AppEntry-f37e0549dede53879adb8deca6e6483c.js" defer></script>
</body>
</html>
